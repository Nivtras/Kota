<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage</title>
<style>
  :root {
    --bg: rgba(20, 20, 22, 0.92);
    --pill-bg: rgba(28, 28, 31, 0.96);
    --line: rgba(255, 255, 255, 0.07);
    --hover: rgba(255, 255, 255, 0.06);
    --text: #ececef;
    --muted: #8e8e96;
    --track: rgba(255, 255, 255, 0.10);
    --ok: #3ddc84;
    --warn: #f5b942;
    --bad: #f26d6d;
    --pill: rgba(255, 255, 255, 0.08);
    --strong: rgba(255, 255, 255, 0.14);
    --marker: #d2d2d8;
    --accent: #8ab4ff;
  }
  /* Follows the Windows app theme (Settings → Personalization → Colors). */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: rgba(249, 249, 251, 0.97);
      --line: rgba(0, 0, 0, 0.09);
      --hover: rgba(0, 0, 0, 0.05);
      --text: #1b1b1f;
      --muted: #5f5f6b;
      --track: rgba(0, 0, 0, 0.10);
      --ok: #1fa85f;
      --warn: #c98a0c;
      --bad: #d64545;
      --pill: rgba(0, 0, 0, 0.06);
      --strong: rgba(0, 0, 0, 0.10);
      --marker: #3c3c46;
      --accent: #2f6fde;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    font: 12px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }
  /* This page is the panel only; the taskbar pill is a native window. */
  img.logo { object-fit: contain; background: transparent; }

  /* ---------- settings ---------- */
  main[hidden] { display: none; }
  .btn.active { color: var(--text); background: var(--hover); }
  .s-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .s-hint { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  .choice {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 4px; border-radius: 6px; cursor: pointer;
  }
  .choice:hover { background: var(--hover); }
  .choice.disabled { opacity: .45; cursor: not-allowed; }
  .choice input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  .choice .logo { width: 18px; height: 18px; }
  .seg { display: inline-flex; background: var(--pill); border-radius: 8px; padding: 2px; margin-top: 6px; }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-weight: 600; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: var(--strong); color: var(--text); }
  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .link-btn {
    border: 1px solid var(--line); background: var(--pill); color: var(--text);
    font: inherit; font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .link-btn:hover { background: var(--strong); }
  .slider-row .val { width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ---------- panel ---------- */
  #expanded {
    display: flex; height: 100%;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 4px;
    padding: 10px 8px 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; font-weight: 600; }
  header .ago { color: var(--muted); font-size: 11px; margin-left: 8px; flex: 1; }
  .btn {
    width: 24px; height: 24px; border-radius: 6px;
    display: grid; place-items: center;
    background: transparent; border: 0; color: var(--muted); cursor: pointer;
  }
  .btn:hover { background: var(--hover); color: var(--text); }
  .btn svg { width: 14px; height: 14px; }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { flex: 1; overflow-y: auto; }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: var(--track); border-radius: 3px; }

  .card { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .card:last-child { border-bottom: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .logo {
    width: 20px; height: 20px; border-radius: 5px; flex: none;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .card-head .name { font-weight: 600; font-size: 14px; }
  .pill { background: var(--pill); color: var(--muted); font-size: 11px; padding: 1px 8px; border-radius: 999px; }
  .toggle { margin-left: auto; }
  .toggle svg { transition: transform .15s; }
  .toggle.open svg { transform: rotate(180deg); }

  .group-name { color: var(--muted); font-size: 11px; font-weight: 600; margin: 8px 0 2px; cursor: default; }
  .group-name:first-of-type { margin-top: 0; }

  .row {
    display: grid;
    grid-template-columns: 112px 1fr 56px 62px;
    align-items: center; gap: 8px;
    padding: 4px 0;
  }
  .row .label { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track { position: relative; height: 5px; background: var(--track); border-radius: 3px; overflow: visible; }
  .track .fill { position: absolute; left: 0; top: 0; }
  /* pace marker: share of the window's time that has passed */
  .marker { position: absolute; top: -3px; width: 2px; height: 11px; margin-left: -1px; background: var(--marker); border-radius: 1px; }
  .pace-warn { color: var(--warn); font-size: 11px; margin: -2px 0 4px 120px; }
  .fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
  .reset { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }
  .pct { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct small { font-weight: 500; color: var(--muted); font-size: 10px; margin-left: 2px; }

  .details { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--line); display: none; }
  .details.open { display: block; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .stat .k { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tok-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tok { background: var(--hover); border-radius: 8px; padding: 8px 10px; }
  .tok-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .stat.total { margin-top: 3px; padding-top: 5px; border-top: 1px solid var(--line); }
  .stat.total .k { color: var(--text); font-weight: 600; }

  .note { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .err { color: var(--bad); font-size: 11px; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<div id="expanded">
  <header>
    <h1>AI Usage</h1>
    <span class="ago" id="ago"></span>
    <button class="btn" id="refresh" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="btn" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="btn" id="collapse" title="Close panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="btn" id="close" title="Quit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <main id="list"><div class="empty">Loading…</div></main>
  <main id="settings" hidden>
    <section class="card">
      <div class="s-title">Taskbar</div>
      <div class="s-hint">Choose up to 2 providers to show on the taskbar.</div>
      <div id="taskbarChoices"></div>
      <div class="s-title" style="margin-top:12px">Taskbar width</div>
      <div class="slider-row">
        <input type="range" id="widthSlider" min="180" max="320" step="10">
        <span class="val" id="widthVal"></span>
      </div>
      <div class="s-title" style="margin-top:12px">Position</div>
      <div class="s-hint">Drag the pill along the taskbar to move it. Left of Start it follows the Start button; right of it, it stays by the clock.</div>
      <button class="link-btn" id="resetPos">Reset position</button>
    </section>
    <section class="card">
      <label class="choice">
        <input type="checkbox" id="autostart">
        <span>Start with Windows</span>
      </label>
      <label class="choice">
        <input type="checkbox" id="notify">
        <span>Notify at 80% / 95% and when a limit is available again</span>
      </label>
      <button class="link-btn" id="testNotify" style="margin:4px 0 0 26px">Send a test notification</button>
    </section>
    <section class="card">
      <div class="s-title">Show limits as</div>
      <div class="seg" id="displaySeg">
        <button data-v="used">Used</button>
        <button data-v="remaining">Remaining</button>
      </div>
    </section>
  </main>
</div>

<script>
// This page is the panel. Data is fetched in Go (app.go) and pushed with the
// "usage" event; the taskbar pill is a native window drawn by Go.
// Official app icons (taken from the installed apps). A provider without an
// image falls back to a coloured letter.
const LOGOS = {
  claude:      { img: 'logos/claude.png',      bg: '#d97757', ch: 'C' },
  antigravity: { img: 'logos/antigravity.png', bg: '#4f7cff', ch: 'A' },
  codex:       { img: 'logos/codex.png',       bg: '#10a37f', ch: 'X' },
};
function logoHTML(u) {
  const lg = logoOf(u);
  const letter = `<span class="logo" style="background:${lg.bg}">${esc(lg.ch)}</span>`;
  if (!lg.img) return letter;
  // onerror swaps in the letter if the image is missing.
  return `<img class="logo img" src="${lg.img}" alt="" onerror="this.outerHTML=this.dataset.fb" data-fb="${esc(letter)}">`;
}
const $ = (id) => document.getElementById(id);
const api = () => window.go && window.go.main && window.go.main.App;
let lastUpdate = null, loading = false, lastData = [], shownAt = 0;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let openDetails = store.get('openDetails', {});

// Settings come from Go (config.json). taskbar: provider IDs (max 2),
// display: 'used' | 'remaining'.
let settings = { taskbar: null, display: 'used', width: 200, minWidth: 180, maxWidth: 320 };

// Percent shown for a bar, following the display setting. Colour always
// reflects how much is used, so red means "close to the limit" either way.
function shown(usedPct) {
  const used = clampPct(usedPct);
  const rem = settings.display === 'remaining';
  return { used, value: rem ? 100 - used : used, word: rem ? 'left' : 'used' };
}
function pctHTML(p) { return `${Math.floor(p.value)}%<small>${p.word}</small>`; }

// Colour by how much is USED.
function color(used) {
  if (used >= 85) return 'var(--bad)';
  if (used >= 60) return 'var(--warn)';
  return 'var(--ok)';
}
const clampPct = (v) => Math.max(0, Math.min(100, v || 0));

function resetShort(iso) {
  if (!iso) return '';
  const d = new Date(iso), ms = d - Date.now();
  if (isNaN(ms)) return '';
  if (ms <= 0) return 'now';
  const m = Math.round(ms / 60000);
  if (m < 60) return m + 'm';
  if (m < 24 * 60) return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  return d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' +
         d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function resetLong(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : 'Resets ' + d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function logoOf(u) { return LOGOS[u.id] || { bg: '#555', ch: (u.name || '?')[0] }; }

// Providers on the taskbar: the user's choice, else the first two
// (same rule as the native pill, pill_model.go).
function taskbarItems(items) {
  const ids = (settings.taskbar || []).filter(id => items.some(u => u.id === id));
  if (!ids.length) return items.slice(0, 2);
  return ids.slice(0, 2).map(id => items.find(u => u.id === id));
}

/* ---------- panel ---------- */
// Pace: how much of the window's time has elapsed and whether the current
// burn rate reaches 100% before the reset (same rules as pill_model.go).
const MIN_PACE_USED = 20;
function pace(b) {
  const reset = Date.parse(b.resetsAt || ''), win = (b.windowSec || 0) * 1000, now = Date.now();
  if (isNaN(reset) || win <= 0 || reset <= now) return null;
  const left = Math.min(reset - now, win), elapsed = win - left;
  const out = { elapsedPct: 100 * elapsed / win, runsOutIn: 0 };
  const used = clampPct(b.usedPct);
  if (used >= MIN_PACE_USED && used < 100 && elapsed > 0) {
    const toLimit = (100 - used) / (used / elapsed);
    if (toLimit < left) out.runsOutIn = toLimit;
  }
  return out;
}
function durShort(ms) {
  const m = Math.round(ms / 60000);
  if (m < 1) return '<1m';
  if (m < 60) return m + 'm';
  if (m < 1440) return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
  return Math.floor(m / 1440) + 'd ' + Math.floor((m % 1440) / 60) + 'h';
}
function barRow(b) {
  const p = shown(b.usedPct);
  const pc = pace(b);
  const marker = pc ? (settings.display === 'remaining' ? 100 - pc.elapsedPct : pc.elapsedPct) : -1;
  const tip = [b.tooltip, resetLong(b.resetsAt),
    pc ? `${Math.round(pc.elapsedPct)}% of the window has passed` : ''].filter(Boolean).join('\n');
  return `<div class="row" title="${esc(tip)}">
    <span class="label">${esc(b.label)}</span>
    <div class="track">
      <div class="fill" style="width:${p.value}%;background:${color(p.used)}"></div>
      ${marker >= 0 ? `<div class="marker" style="left:${marker}%"></div>` : ''}
    </div>
    <span class="reset">${esc(resetShort(b.resetsAt))}</span>
    <span class="pct">${pctHTML(p)}</span>
  </div>
  ${pc && pc.runsOutIn ? `<div class="pace-warn">At this pace: limit reached in ${durShort(pc.runsOutIn)}</div>` : ''}`;
}
// Token dropdown: one block per time window, side by side.
function tokenBlocks(tw) {
  return `<div class="tok-grid">${tw.map(w => `
    <div class="tok">
      <div class="tok-title">${esc(w.label)}</div>
      <div class="stat"><span class="k">Input</span><span class="v">${esc(w.input)}</span></div>
      <div class="stat"><span class="k">Output</span><span class="v">${esc(w.output)}</span></div>
      <div class="stat total"><span class="k">Total Tokens</span><span class="v">${esc(w.total)}</span></div>
    </div>`).join('')}</div>`;
}
function card(u) {
  const tokens = u.tokens || [];
  const hasDetails = tokens.length > 0 || (u.details || []).length > 0;
  const open = !!openDetails[u.id];
  const groups = (u.groups || []).map(g => `
    ${g.name ? `<div class="group-name" title="${esc(g.tooltip)}">${esc(g.name)}</div>` : ''}
    ${(g.bars || []).map(barRow).join('')}
  `).join('');
  const details = hasDetails ? `<div class="details ${open ? 'open' : ''}">
      ${tokens.length ? tokenBlocks(tokens) : ''}
      ${(u.details || []).map(s => `<div class="stat"><span class="k">${esc(s.label)}</span><span class="v">${esc(s.value)}</span></div>`).join('')}
    </div>` : '';
  return `<section class="card">
    <div class="card-head">
      ${logoHTML(u)}
      <span class="name">${esc(u.name)}</span>
      ${u.plan ? `<span class="pill">${esc(u.plan)}</span>` : ''}
      ${hasDetails ? `<button class="btn toggle ${open ? 'open' : ''}" data-id="${esc(u.id)}" title="Token details">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ''}
    </div>
    ${u.error ? `<div class="err">${esc(u.error)}</div>` : ''}
    ${groups}
    ${u.note ? `<div class="note">${esc(u.note)}</div>` : ''}
    ${details}
  </section>`;
}

// A window whose reset time has passed has been refilled, even if the data
// is from before that moment (cache, rate limit, closed app): show it as 0%.
function liveView(items) {
  const now = Date.now();
  return items.map(u => ({
    ...u,
    groups: (u.groups || []).map(g => ({
      ...g,
      bars: (g.bars || []).map(b => {
        const t = b.resetsAt ? Date.parse(b.resetsAt) : NaN;
        return !isNaN(t) && t <= now ? { ...b, usedPct: 0, resetsAt: '' } : b;
      }),
    })),
  }));
}

function render(raw) {
  lastData = raw;
  const items = liveView(raw);
  $('list').innerHTML = items.map(card).join('') || '<div class="empty">No providers</div>';
  if (!$('settings').hidden) renderSettings();
}

/* ---------- settings ---------- */
function currentTaskbarIds() { return taskbarItems(lastData).map(u => u.id); }
function renderSettings() {
  const chosen = currentTaskbarIds();
  $('taskbarChoices').innerHTML = lastData.map(u => {
    const on = chosen.includes(u.id);
    const disabled = !on && chosen.length >= 2;
    return `<label class="choice ${disabled ? 'disabled' : ''}">
      <input type="checkbox" data-id="${esc(u.id)}" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
      ${logoHTML(u)}<span>${esc(u.name)}</span>
    </label>`;
  }).join('') || '<div class="s-hint">No providers found.</div>';
  for (const b of $('displaySeg').querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === settings.display);
  const s = $('widthSlider');
  if (settings.minWidth) { s.min = settings.minWidth; s.max = settings.maxWidth; }
  if (document.activeElement !== s) s.value = settings.width;
  $('widthVal').textContent = settings.width + ' px';
  $('autostart').checked = !!settings.autostart;
  $('notify').checked = settings.notify !== false;
}
$('notify').addEventListener('change', (e) => {
  settings.notify = e.target.checked;
  api().SetNotifications(settings.notify);
});
$('testNotify').onclick = () => api().TestNotification();
$('resetPos').onclick = () => api().ResetPillPosition();
$('autostart').addEventListener('change', async (e) => {
  settings.autostart = await api().SetAutostart(e.target.checked);
  e.target.checked = settings.autostart; // reflect what actually happened
});
// Width slider: the taskbar pill resizes live while dragging, saved on release.
$('widthSlider').addEventListener('input', (e) => {
  settings.width = +e.target.value;
  $('widthVal').textContent = settings.width + ' px';
  api().SetCompactWidth(settings.width, false);
});
$('widthSlider').addEventListener('change', (e) => {
  settings.width = +e.target.value;
  api().SetCompactWidth(settings.width, true);
});
function saveSettings() {
  api().SaveSettings(settings);
  render(lastData);
}
$('taskbarChoices').addEventListener('change', (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  let ids = currentTaskbarIds().filter(x => x !== id);
  if (e.target.checked) ids.push(id);
  // keep provider display order on the pill
  settings.taskbar = lastData.map(u => u.id).filter(x => ids.includes(x)).slice(0, 2);
  saveSettings();
});
$('displaySeg').addEventListener('click', (e) => {
  const v = e.target.dataset && e.target.dataset.v;
  if (!v || v === settings.display) return;
  settings.display = v;
  saveSettings();
});
function showSettings(on) {
  $('settings').hidden = !on;
  $('list').hidden = on;
  $('settingsBtn').classList.toggle('active', on);
  if (on) renderSettings();
}
$('settingsBtn').onclick = () => showSettings($('settings').hidden);

$('list').addEventListener('click', (e) => {
  const t = e.target.closest('.toggle');
  if (!t) return;
  openDetails[t.dataset.id] = !openDetails[t.dataset.id];
  store.set('openDetails', openDetails);
  render(lastData);
});

/* ---------- open / close ---------- */
// Go shows the panel (pill click) and hides it; the page only asks to hide.
function hidePanel() { showSettings(false); api().HidePanel(); }
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePanel(); });
// Losing focus closes the panel (ignore the moment right after it appears).
window.addEventListener('blur', () => { if (Date.now() - shownAt > 300) hidePanel(); });

/* ---------- data ---------- */
function gotData(data) {
  render(data || []);
  lastUpdate = Date.now();
  tickAgo();
}
function tickAgo() {
  if (!lastUpdate) return;
  const s = Math.round((Date.now() - lastUpdate) / 1000);
  $('ago').textContent = s < 60 ? 'just now' : Math.floor(s / 60) + 'm ago';
  if (lastData.length) render(lastData); // keep reset countdowns fresh
}
async function refresh() {
  if (loading || !api()) return;
  loading = true;
  $('refresh').classList.add('spin');
  try {
    gotData(await api().Refresh());
  } catch (e) {
    $('list').innerHTML = `<div class="empty err">${esc(e)}</div>`;
  } finally {
    loading = false;
    $('refresh').classList.remove('spin');
  }
}

$('refresh').onclick = refresh;
$('collapse').onclick = hidePanel;
$('close').onclick = () => api().Quit();

async function boot() {
  if (!api() || !(window.runtime && window.runtime.EventsOn)) return setTimeout(boot, 50);
  window.runtime.EventsOn('usage', gotData);
  window.runtime.EventsOn('panel:shown', () => { shownAt = Date.now(); tickAgo(); });
  window.runtime.EventsOn('panel:settings', () => { shownAt = Date.now(); showSettings(true); });
  try { settings = await api().GetSettings(); } catch {}
  try { gotData(await api().GetUsage()); } catch {}
}
boot();
setInterval(tickAgo, 30000);
</script>
</body>
</html>
