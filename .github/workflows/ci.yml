name: CI

# Every push and pull request: vet, test and build on Windows.
# A pushed tag "vX.Y.Z" also publishes the GitHub release (exe + zip).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        # Tests that need a real desktop (taskbar, registry, notifications)
        # skip themselves on the runner.
        run: go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend tests
        run: node --test "frontend/tests/*.test.js"

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $v = (Select-String -Path go.mod -Pattern 'github.com/wailsapp/wails/v2 (v[\d.]+)').Matches[0].Groups[1].Value
          go install "github.com/wailsapp/wails/v2/cmd/wails@$v"

      - name: Build
        run: wails build -clean -skipbindings -trimpath

      - uses: actions/upload-artifact@v4
        with:
          name: Kota.exe
          path: build/bin/Kota.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $code = (Select-String -Path internal/buildinfo/buildinfo.go -Pattern 'Version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $wails = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($tag -ne $code -or $tag -ne $wails) { throw "tag ${tag}, buildinfo ${code}, wails.json ${wails} - they must match" }
          "KOTA_VERSION=$tag" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: Kota.exe
          path: dist

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Kota | Out-Null
          Copy-Item dist/Kota.exe, packaging/KURULUM.txt dist/Kota/
          Compress-Archive -Path dist/Kota/* -DestinationPath dist/Kota-win64.zip
          $sums = Get-FileHash dist/Kota-win64.zip, dist/Kota.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $notes = "docs/releases/${{ github.ref_name }}.md"
          $body = if (Test-Path $notes) { Get-Content $notes -Raw } else { "" }
          $fence = '```'
          $body += "`n### SHA-256`n$fence`n$($sums -join "`n")`n$fence`n"
          Set-Content dist/notes.md $body

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/Kota-win64.zip dist/Kota.exe
          --title "Kota $env:KOTA_VERSION"
          --notes-file dist/notes.md
          --latest
